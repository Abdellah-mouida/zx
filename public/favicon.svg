<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="ZEROOX">
  <title>ZEROOX</title>
  <!--
    The Ø motif. A glass ring with a bright top-left edge falling to
    transparent at bottom-right, exactly as DESIGN.md §3 specifies the
    glass edge, plus the accent slash through it.
  -->
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7FB2FF" />
      <stop offset="0.55" stop-color="#3D8BFF" stop-opacity="0.55" />
      <stop offset="1" stop-color="#3D8BFF" stop-opacity="0.08" />
    </linearGradient>
    <radialGradient id="bounce" cx="0.5" cy="0.62" r="0.5">
      <stop offset="0" stop-color="#3D8BFF" stop-opacity="0.30" />
      <stop offset="1" stop-color="#3D8BFF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="32" height="32" fill="#000000" />
  <circle cx="16" cy="16" r="11" fill="url(#bounce)" />
  <circle cx="16" cy="16" r="9.5" fill="none" stroke="url(#edge)" stroke-width="2.25" />
  <path d="M9.4 22.6 L22.6 9.4" stroke="url(#edge)" stroke-width="2.25" stroke-linecap="butt" />
</svg>
